<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Насмотренность</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a design-review desk. Two proofs side by side under a scoreboard; after the answer the worse proof gets red-pen redlines in Figma's measurement colour. */
:root{
  --bg:#EEF0F3;
  --panel:#FFFFFF;
  --stage:#E3E6EA;
  --ink:#121417;
  --muted:#5B626B;
  --line:#D8DCE1;
  --pen:#F24822;
  --ok:#12804A;
  --ok-soft:#E2F3E9;
  --bad:#CC2B2B;
  --bad-soft:#FBE6E6;
  --font:"Geologica", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0F1114;--panel:#171A1E;--stage:#22262B;--ink:#ECEEF0;--muted:#9AA1A9;--line:#2B3036;--pen:#FF6B42;--ok:#45D18F;--ok-soft:#14301F;--bad:#FF7070;--bad-soft:#3A1B1B;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1114;--panel:#171A1E;--stage:#22262B;--ink:#ECEEF0;--muted:#9AA1A9;--line:#2B3036;--pen:#FF6B42;--ok:#45D18F;--ok-soft:#14301F;--bad:#FF7070;--bad-soft:#3A1B1B;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:24px 64px}
@media (max-width:640px){.wrap{padding-inline:16px;padding-block:16px 48px}}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px}

.bar{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.bar h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.05;font-weight:700;letter-spacing:-0.025em}
.bar p{margin:8px 0 0;color:var(--muted);max-width:56ch;text-wrap:pretty}
.stats{display:flex;gap:6px;margin:0;flex-wrap:wrap}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:84px}
.stats dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font:600 22px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--line);border-radius:4px;margin:20px 0 22px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--ink);border-radius:4px;transition:width .3s}

.q{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.q h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em;margin-right:auto}
.chip{font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-weight:500}
.lvl{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.1em}
.keys{font:500 12px/1 var(--mono);color:var(--muted)}
.keys kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--panel);color:var(--ink);font:inherit}
@media (hover:none){.keys{display:none}}

.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.duel{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:2px solid var(--line);border-radius:18px;cursor:pointer;overflow:hidden;text-align:left;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--ink)}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{border-color:var(--line)}
.opt.is-ok,.opt.is-ok:hover{border-color:var(--ok)}
.opt.is-bad,.opt.is-bad:hover{border-color:var(--bad)}
.opt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0}
.letter{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--panel);font-weight:600;font-size:16px}
.verdict{font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px;visibility:hidden}
.opt.is-ok .verdict{visibility:visible;background:var(--ok-soft);color:var(--ok)}
.opt.is-bad .verdict{visibility:visible;background:var(--bad-soft);color:var(--bad)}
.stage{display:grid;place-items:center;padding:20px 14px 26px;min-height:300px;overflow:hidden}
.host{zoom:1}
@media (min-width:1080px){.host{zoom:1.12}}
@media (max-width:380px){.host{zoom:.92}}

.explain{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:grid;gap:10px}
.ex-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.res{font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--bad-soft);color:var(--bad)}
.explain h3{margin:0;font-size:22px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance}
.explain p{margin:0;max-width:68ch;text-wrap:pretty}
.review{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:12px}
.review span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.review em{font-style:normal}
.ex-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);font:600 15px/1 var(--font);padding:13px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.hint{font:500 12px/1 var(--mono);color:var(--muted)}

.summary{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:22px}
.sum-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px}
.big{font:700 clamp(64px,10vw,104px)/0.9 var(--font);letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.big small{font-size:.35em;color:var(--muted);letter-spacing:0;font-weight:500}
.sum-top h2{margin:0;font-size:26px;letter-spacing:-0.01em}
.sum-top p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 24px}
.cat-row{display:grid;gap:6px}
.cat-row header{display:flex;justify-content:space-between;font-size:14px}
.cat-row header b{font-weight:500}
.cat-row header span{font:500 13px/1.4 var(--mono);color:var(--muted)}
.meter{height:8px;background:var(--stage);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:6px}
.missed h3{margin:0 0 8px;font-size:17px}
.missed ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.missed li{display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:12px}
.missed li b{font-weight:600}
.missed li span{color:var(--muted);font-size:14px;line-height:1.45}
.missed li small{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- mock UI kit (the proofs) ---------- */
.mk{--a:#3D5AFE;--ink:#16181D;--mut:#5F6670;--bgm:#F4F5F7;--sur:#FFFFFF;--ln:#E3E6EA;position:relative;width:320px;color:var(--ink);font:14px/1.45 "Inter",system-ui,sans-serif;text-align:left;letter-spacing:0}
.mk *{box-sizing:border-box}
.mk p{margin:0}
.mk .card{background:var(--sur);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07)}
.mk .h{font-size:20px;line-height:1.25;font-weight:650;letter-spacing:-.01em}
.mk .h3{font-size:16px;line-height:1.3;font-weight:650}
.mk .t{color:var(--mut)}
.mk .sm{font-size:12.5px}
.mk .lbl{font-size:13px;line-height:1.3;color:var(--mut);font-weight:500}
.mk .inp{height:44px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;display:flex;align-items:center;background:#fff;color:var(--ink)}
.mk .ph{color:#9AA1AA}
.mk .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:10px;background:var(--a);color:#fff;font-weight:600;white-space:nowrap}
.mk .btn2{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--ln);background:#fff;color:var(--ink);font-weight:600;white-space:nowrap}
.mk .full{width:100%}
.mk .row{display:flex;align-items:center;gap:10px}
.mk .img{height:140px;border-radius:12px;background:radial-gradient(120% 90% at 85% 10%,color-mix(in oklab,var(--a) 55%,#fff) 0 30%,transparent 31%),linear-gradient(135deg,color-mix(in oklab,var(--a) 22%,#fff),color-mix(in oklab,var(--a) 45%,#fff))}
.mk .ava{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,color-mix(in oklab,var(--a) 35%,#fff),color-mix(in oklab,var(--a) 70%,#fff));flex:none}
.mk .ic{width:20px;height:20px;flex:none;color:var(--ink)}
.mk .tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--a);background:color-mix(in oklab,var(--a) 12%,#fff);padding:4px 8px;border-radius:6px}
.mk .sep{height:1px;background:var(--ln)}
.mk .tog{width:40px;height:24px;border-radius:12px;background:var(--a);position:relative;flex:none}
.mk .tog::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.mk .tog.off{background:#D5D9DE}
.mk .tog.off::after{right:auto;left:3px}
.mk .chev{margin-left:auto;color:#A3A9B1}
.mk .num{font-variant-numeric:tabular-nums}
.ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.ov .ln{position:absolute;background:var(--pen)}
.ov .lab{position:absolute;transform:translate(-50%,-50%);background:var(--pen);color:#fff;font:600 10.5px/1 "JetBrains Mono",monospace;padding:3px 5px;border-radius:4px;white-space:nowrap}
.ov .box{position:absolute;border:2px solid var(--pen);border-radius:8px;box-shadow:0 0 0 3px color-mix(in oklab,var(--pen) 22%,transparent)}
.ov .guide{position:absolute;width:0;border-left:1.5px dashed var(--pen)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.progress span,.opt{transition:none}}
</style>

<div class="wrap">
  <header class="bar">
    <div>
      <h1>Насмотренность</h1>
      <p>Два варианта одного экрана. Выбери тот, что сделан лучше. После ответа покажу, что не так с другим, и как сказать об этом на ревью.</p>
    </div>
    <dl class="stats">
      <div><dt>Раунд</dt><dd id="s-round">1/15</dd></div>
      <div><dt>Верно</dt><dd id="s-score">0</dd></div>
      <div><dt>Серия</dt><dd id="s-streak">0</dd></div>
      <div><dt>Рекорд</dt><dd id="s-best">0</dd></div>
    </dl>
  </header>
  <div class="progress" aria-hidden="true"><span id="prog"></span></div>

  <section id="round" aria-live="polite">
    <div class="q">
      <span class="chip" id="cat">Отступы</span>
      <span class="lvl" id="lvl" title="Сложность">●○○</span>
      <h2>Где сделано лучше?</h2>
      <span class="keys"><kbd>←</kbd> А · Б <kbd>→</kbd> · дальше <kbd>Enter</kbd></span>
    </div>
    <div class="duel">
      <div class="opt" id="opt-a" role="button" tabindex="0" aria-label="Вариант А">
        <div class="opt-top"><span class="letter" aria-hidden="true">А</span><span class="verdict" id="v-a"></span></div>
        <div class="stage"><div class="host" id="host-a"></div></div>
      </div>
      <div class="opt" id="opt-b" role="button" tabindex="0" aria-label="Вариант Б">
        <div class="opt-top"><span class="letter" aria-hidden="true">Б</span><span class="verdict" id="v-b"></span></div>
        <div class="stage"><div class="host" id="host-b"></div></div>
      </div>
    </div>
    <div class="explain" id="explain" hidden>
      <div class="ex-head"><span class="res" id="res"></span><h3 id="ex-title"></h3></div>
      <p id="ex-why"></p>
      <div class="review"><span>Как сказать на ревью</span><em id="ex-review"></em></div>
      <div class="ex-actions"><button class="btn" id="next" type="button">Дальше</button><span class="hint">или Enter</span></div>
    </div>
  </section>

  <section class="summary" id="summary" hidden aria-live="polite">
    <div class="sum-top">
      <div class="big" id="sum-score">0<small>/15</small></div>
      <div><h2 id="sum-title"></h2><p id="sum-text"></p></div>
    </div>
    <div class="cats" id="sum-cats"></div>
    <div class="missed" id="sum-missed"></div>
    <div class="ex-actions"><button class="btn" id="again" type="button">Ещё 15 раундов</button><span class="hint" id="sum-best"></span></div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const ROUNDS = 15;
const PLAN = [1, 1, 1, 2, 1, 2, 2, 2, 2, 3, 2, 3, 3, 2, 3];

/* ---------- random content ---------- */
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rub = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
const ACCENTS = ['#3D5AFE', '#0E8A62', '#7048E8', '#D9480F', '#0B7285', '#C2255C', '#1C7ED6'];
const PRODUCTS = [['Кофемолка ручная', 'Керамические жернова, 25 г кофе за раз'], ['Рюкзак городской', 'Не промокает, есть отделение для ноутбука'], ['Термокружка', '450 мл, держит тепло шесть часов'], ['Настольная лампа', 'Тёплый свет и три режима яркости'], ['Беговые кроссовки', 'Лёгкая подошва, 230 г на пару'], ['Наушники', 'До 30 часов без подзарядки']];
const PEOPLE = [['Анна Котова', 'Продуктовый дизайнер'], ['Илья Смирнов', 'Арт-директор'], ['Марина Лис', 'Фронтенд-разработчица'], ['Олег Брагин', 'Маркетолог'], ['Вера Ким', 'UX-исследовательница']];
const ARTICLES = ['Как мы переписали онбординг и подняли активацию', 'Пять ошибок в первом портфолио', 'Зачем дизайнеру считать метрики', 'Дизайн-ревью без обид'];
const TASKS = ['Собрать мудборд', 'Показать черновик клиенту', 'Поправить сетку', 'Выгрузить ассеты', 'Написать тексты кнопок', 'Проверить тёмную тему'];
const SETTINGS = ['Уведомления', 'Тёмная тема', 'Язык', 'Конфиденциальность', 'Резервные копии'];
const FEATURES = ['Безлимитные проекты', 'Совместная работа', 'История версий', 'Экспорт в PDF', 'Поддержка в чате'];

/* ---------- small helpers for mocks ---------- */
const mk = (inner, acc, style) => `<div class="mk" style="--a:${acc};${style || ''}">${inner}</div>`;
const card = (inner, style, attrs) => `<div class="card" style="${style || ''}" ${attrs || ''}>${inner}</div>`;
const ICONS = {
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  moon: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>',
  home: '<path d="M4 11l8-7 8 7v9H4z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  heart: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
};
const icon = (n, o) => { o = o || {}; return `<svg class="ic" viewBox="0 0 24 24" fill="${o.fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="${o.fill ? 0 : 1.8}" stroke-linecap="round" stroke-linejoin="round" ${o.attrs || ''} style="${o.style || ''}">${ICONS[n]}</svg>`; };
function lum(hex) { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
const ratio = (a, b) => { const x = lum(a), y = lum(b); return ((Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05)).toFixed(1).replace('.', ','); };

/* ---------- challenges ----------
   each make(acc) returns { good, bad, marks, why? }
   marks: gap (vertical distance a→b), gapH, padL/padR (box→child), edge (left edges of a and b), box (outline) */
const C = [];
const add = (o) => C.push(o);

// ===== Отступы
add({ id: 'label-prox', cat: 'Отступы', lvl: 1, title: 'Подпись ближе к своему полю',
  why: 'Когда подпись стоит посередине между полями, непонятно, к какому из них она относится. До своего поля расстояние должно быть заметно меньше, чем до соседнего.',
  review: '«Подписи висят между полями. Давай прижмём их к инпутам, а между парами оставим больше воздуха»',
  make(acc) {
    const f = (lab, val, g1, g2, k) => `<div style="margin-bottom:${g2}px"><div class="lbl" data-m="${k}l" style="margin-bottom:${g1}px">${lab}</div><div class="inp" data-m="${k}i">${val}</div></div>`;
    const v = (g1, g2) => mk(card(`<p class="h" style="margin-bottom:18px">Вход в кабинет</p>${f('Почта', 'anna@example.com', g1, g2, 'a')}${f('Пароль', '••••••••••', g1, g2, 'b')}<div class="btn full" style="margin-top:4px">Войти</div>`), acc);
    return { good: v(6, 20), bad: v(14, 14), marks: [{ t: 'gap', a: 'al', b: 'ai' }, { t: 'gap', a: 'ai', b: 'bl' }] };
  } });
add({ id: 'card-pad', cat: 'Отступы', lvl: 2, title: 'Равные поля внутри карточки',
  why: 'Слева отступ меньше, чем справа, и содержимое выглядит прижатым к краю. Горизонтальные отступы внутри карточки делают одинаковыми.',
  review: '«Слева паддинг 10, справа 20. Приведём к одному значению из сетки»',
  make(acc) {
    const [n, d] = pick(PRODUCTS), price = rint(19, 89) * 100 - 10;
    const v = (pl) => mk(card(`<div class="img" style="margin-bottom:14px"></div><p class="h3" data-m="t">${n}</p><p class="t" style="margin:4px 0 14px">${d}</p><div class="row" style="justify-content:space-between"><b style="font-size:18px">${rub(price)}</b><div class="btn">В корзину</div></div>`, `padding:20px 20px 20px ${pl}px`, 'data-m="c"'), acc);

/* ---------- overlay marks ---------- */
function rel(el, root) { let x = 0, y = 0, n = el; while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return { x, y, w: el.offsetWidth, h: el.offsetHeight }; }
function drawMarks(host, marks, isBad) {
  const root = host.querySelector('.mk'); if (!root) return;
  const ov = document.createElement('div'); ov.className = 'ov'; root.appendChild(ov);
  const q = (k) => root.querySelector(`[data-m="${k}"]`);
  const div = (cls, st, txt) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, st); if (txt != null) d.textContent = txt; ov.appendChild(d); return d; };
  const vline = (x, y1, y2) => { const v = Math.round(y2 - y1); div('ln', { left: x + 'px', top: y1 + 'px', width: '1px', height: Math.max(0, y2 - y1) + 'px' }); div('ln', { left: x - 4 + 'px', top: y1 + 'px', width: '9px', height: '1px' }); div('ln', { left: x - 4 + 'px', top: y2 + 'px', width: '9px', height: '1px' }); div('lab', { left: x - 18 + 'px', top: (y1 + y2) / 2 + 'px' }, v); };
  const hline = (y, x1, x2) => { const v = Math.round(x2 - x1); div('ln', { left: x1 + 'px', top: y + 'px', width: Math.max(0, x2 - x1) + 'px', height: '1px' }); div('ln', { left: x1 + 'px', top: y - 4 + 'px', width: '1px', height: '9px' }); div('ln', { left: x2 + 'px', top: y - 4 + 'px', width: '1px', height: '9px' }); div('lab', { left: (x1 + x2) / 2 + 'px', top: y - 11 + 'px' }, v); };
  for (const m of marks) {
    if (m.t === 'box') { if (!isBad) continue; const e = q(m.a); if (!e) continue; const r = rel(e, root); div('box', { left: r.x - 5 + 'px', top: r.y - 5 + 'px', width: r.w + 10 + 'px', height: r.h + 10 + 'px' }); continue; }
    const a = q(m.a || m.box), b = q(m.b || m.child); if (!a || !b) continue;
    const A = rel(a, root), B = rel(b, root);
    if (m.t === 'gap') vline(Math.max(A.x + A.w, B.x + B.w) - 22, A.y + A.h, B.y);
    if (m.t === 'gapH') hline(B.y + B.h / 2, A.x + A.w, B.x);
    if (m.t === 'padL') hline(B.y + B.h / 2, A.x, B.x);
    if (m.t === 'padR') hline(B.y + B.h / 2, B.x + B.w, A.x + A.w);
    if (m.t === 'edge') {
      const top = Math.min(A.y, B.y) - 8, bot = Math.max(A.y + A.h, B.y + B.h) + 8;
      div('guide', { left: A.x + 'px', top: top + 'px', height: bot - top + 'px' });
      if (Math.abs(B.x - A.x) >= 1) { div('guide', { left: B.x + 'px', top: top + 'px', height: bot - top + 'px' }); div('lab', { left: (A.x + B.x) / 2 + 'px', top: bot + 10 + 'px' }, Math.round(B.x - A.x)); }
    }
  }
}

/* ---------- game state ---------- */
const KEY = 'nasmotrennost-v1';
let store = { best: 0, games: 0 };
try { store = Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage unavailable */ }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } };
let G;
function newGame() {
  const used = new Set(), queue = [], perCat = {};
  let lastCat = '';
  const byBalance = (pool) => shuffle(pool).sort((x, y) => (perCat[x.cat] || 0) - (perCat[y.cat] || 0));
  for (const lvl of PLAN) {
    let pool = byBalance(C.filter((c) => !used.has(c.id) && c.lvl === lvl && c.cat !== lastCat));
    const least = Math.min(...C.filter((c) => !used.has(c.id)).map((c) => perCat[c.cat] || 0));
    if (!pool.length || (perCat[pool[0].cat] || 0) > least + 1) pool = byBalance(C.filter((c) => !used.has(c.id) && c.cat !== lastCat));
    if (!pool.length) pool = byBalance(C.filter((c) => !used.has(c.id)));
    const ch = pool[0]; used.add(ch.id); lastCat = ch.cat; perCat[ch.cat] = (perCat[ch.cat] || 0) + 1; queue.push(ch);
  }
  G = { queue, i: 0, score: 0, streak: 0, answered: false, log: [] };
  $('#summary').hidden = true; $('#round').hidden = false;
  showRound();
}
function showRound() {
  const ch = G.queue[G.i];
  const acc = pick(ACCENTS);
  const r = ch.make(acc);
  const badSide = Math.random() < 0.5 ? 'a' : 'b';
  G.cur = { ch, r, badSide };
  G.answered = false;
  $('#host-a').innerHTML = badSide === 'a' ? r.bad : r.good;
  $('#host-b').innerHTML = badSide === 'b' ? r.bad : r.good;
  for (const s of ['a', 'b']) { const o = $(`#opt-${s}`); o.classList.remove('is-ok', 'is-bad'); o.setAttribute('aria-disabled', 'false'); $(`#v-${s}`).textContent = ''; }
  $('#cat').textContent = ch.cat;
  $('#lvl').textContent = '●'.repeat(ch.lvl) + '○'.repeat(3 - ch.lvl);
  $('#lvl').setAttribute('aria-label', `Сложность ${ch.lvl} из 3`);
  $('#explain').hidden = true;
  updateStats();
}
function updateStats() {
  $('#s-round').textContent = `${Math.min(G.i + 1, ROUNDS)}/${ROUNDS}`;
  $('#s-score').textContent = G.score;
  $('#s-streak').textContent = G.streak;
  $('#s-best').textContent = store.best;
  $('#prog').style.width = `${((G.i + (G.answered ? 1 : 0)) / ROUNDS) * 100}%`;
}
function answer(side) {
  if (G.answered) return;
  G.answered = true;
  const { ch, r, badSide } = G.cur;
  const goodSide = badSide === 'a' ? 'b' : 'a';
  const ok = side === goodSide;
  if (ok) { G.score++; G.streak++; } else G.streak = 0;
  G.log.push({ id: ch.id, cat: ch.cat, title: ch.title, review: ch.review, ok });
  $(`#opt-${goodSide}`).classList.add('is-ok'); $(`#v-${goodSide}`).textContent = 'Так лучше';
  $(`#opt-${badSide}`).classList.add('is-bad'); $(`#v-${badSide}`).textContent = 'Здесь ошибка';
  for (const s of ['a', 'b']) $(`#opt-${s}`).setAttribute('aria-disabled', 'true');
  drawMarks($(`#host-${badSide}`), r.marks, true);
  drawMarks($(`#host-${goodSide}`), r.marks.filter((m) => m.t !== 'box' && m.t !== 'edge'), false);
  const res = $('#res'); res.className = 'res ' + (ok ? 'ok' : 'bad'); res.textContent = ok ? 'Верно' : 'Мимо';
  $('#ex-title').textContent = ch.title;
  let why = ch.why; if (r.vars) for (const k in r.vars) why = why.replace(`{${k}}`, r.vars[k]);
  $('#ex-why').textContent = why;
  $('#ex-review').textContent = ch.review;
  $('#next').textContent = G.i + 1 >= ROUNDS ? 'Итоги' : 'Дальше';
  $('#explain').hidden = false;
  updateStats();
  $('#next').focus({ preventScroll: true });
  const ex = $('#explain'); const rect = ex.getBoundingClientRect();
  if (rect.bottom > window.innerHeight) ex.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
function next() {
  if (!G.answered) return;
  G.i++;
  if (G.i >= ROUNDS) { finish(); return; }
  showRound();
  window.scrollTo({ top: Math.max(0, $('.progress').offsetTop - 12), behavior: 'auto' });
}
const VERDICTS = [[14, 'Глаз арт-директора', 'Ошибки видишь раньше, чем их успевают показать. На ревью с таким глазом спокойно.'], [11, 'Уверенный уровень', 'Почти всё ловишь. Посмотри список ниже: это темы, где глаз ещё может подвести.'], [7, 'Крепкая база', 'Крупные ошибки видишь сразу, тонкие пока проскакивают. Пройди ещё пару партий.'], [0, 'Глаз разогревается', 'Нормальное начало. Объяснения после каждого раунда как раз для этого: через пару партий результат вырастет.']];
function finish() {
  store.games++; if (G.score > store.best) store.best = G.score; persist();
  $('#round').hidden = true; $('#summary').hidden = false;
  $('#sum-score').innerHTML = `${G.score}<small>/${ROUNDS}</small>`;
  const [, t, d] = VERDICTS.find(([min]) => G.score >= min);
  $('#sum-title').textContent = t; $('#sum-text').textContent = d;
  const cats = {};
  for (const l of G.log) { cats[l.cat] = cats[l.cat] || [0, 0]; cats[l.cat][1]++; if (l.ok) cats[l.cat][0]++; }
  $('#sum-cats').innerHTML = Object.entries(cats).map(([c, [ok, all]]) => `<div class="cat-row"><header><b>${c}</b><span>${ok} из ${all}</span></header><div class="meter" role="img" aria-label="${c}: ${ok} из ${all}"><i style="width:${(ok / all) * 100}%"></i></div></div>`).join('');
  const missed = G.log.filter((l) => !l.ok);
  $('#sum-missed').innerHTML = missed.length ? `<h3>Что повторить</h3><ul>${missed.map((m) => `<li><small>${m.cat}</small><b>${m.title}</b><span>${m.review}</span></li>`).join('')}</ul>` : '<h3>Ни одного промаха</h3>';
  $('#sum-best').textContent = `Рекорд: ${store.best} из ${ROUNDS} · сыграно партий: ${store.games}`;
  updateStats(); $('#prog').style.width = '100%';
  $('#again').focus({ preventScroll: true });
}

/* ---------- input ---------- */
for (const s of ['a', 'b']) {
  const o = $(`#opt-${s}`);
  o.addEventListener('click', () => answer(s));
  o.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); if (!G.answered) answer(s); else next(); } });
}
$('#next').addEventListener('click', next);
$('#again').addEventListener('click', newGame);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if ($('#round').hidden) { if (e.key === 'Enter' && e.target === document.body) newGame(); return; }
  if (!G.answered) {
    if (e.key === 'ArrowLeft' || e.key === '1' || e.code === 'KeyF') { e.preventDefault(); answer('a'); }
    if (e.key === 'ArrowRight' || e.key === '2' || e.code === 'KeyJ') { e.preventDefault(); answer('b'); }
  } else if ((e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ') && !(e.target.classList && e.target.classList.contains('btn'))) { e.preventDefault(); next(); }
});

if (location.hash === '#debug') window.__nasm = { C, drawMarks, pick, ACCENTS };
newGame();
})();
</script>
